[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ims-bootstrap"
dynamic = ["version"]
description = "A collection of Django widgets and templatetags for Bootstrap integration."
readme = "README.md"
license = "BSD-2-Clause"
authors = [
    { name = "Dan Watson", email = "watsond@imsweb.com" },
]
maintainers = [
  { name = "Brad Rutten", email = "ruttenb@imsweb.com" },
  { name = "Jacob Tomlinson", email = "tomlinsonj@imsweb.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/imsweb/django-bootstrap"

[tool.hatch.version]
path = "bootstrap/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/bootstrap",
]

[tool.hatch.build.targets.wheel]
packages = ["bootstrap"]
